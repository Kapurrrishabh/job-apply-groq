{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block auth %}
<form class="card auth-card" method="post" action="/login">
  <div class="logo dark">job-apply<span>·groq</span></div>
  <h1>Sign in</h1>
  <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
  <label>Email</label><input type="email" name="email" required autofocus>
  <label>Password</label><input type="password" name="password" required>
  <div class="actions"><button class="btn">Sign in</button><a href="/register">Create an account for someone else</a></div>
</form>
{% endblock %}
